name: Deploy to Bunny (Staging)

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUNNY_STORAGE_ZONE: og-experience-staging
      BUNNY_STORAGE_ACCESS_KEY: c2ba3d16-aebb-4763-81a9ddb9a98c-83c7-40a9
      BUNNY_API_KEY: ac483308-c329-48e7-be29-c6599f20f7ac0c34d20c-8e3a-494c-8399-4c071f6a797f
      BUNNY_PULL_ZONE_URL: https://og-experience-staging.b-cdn.net
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload site to Bunny Storage
        run: |
          cd out
          sudo apt-get update && sudo apt-get install -y file
          find . -type f -print0 | while IFS= read -r -d '' file; do
            rel="${file#./}"
            mime=$(file -b --mime-type "$file" 2>/dev/null || echo "application/octet-stream")
            curl -sS -X PUT -T "$file" "https://sg.storage.bunnycdn.com/${BUNNY_STORAGE_ZONE}/${rel}" -H "AccessKey: ${BUNNY_STORAGE_ACCESS_KEY}" -H "Content-Type: ${mime}" --fail || { echo "Failed to upload $file"; exit 1; }
          done

      - name: Purge Bunny CDN cache
        run: |
          curl -sS -X POST "https://api.bunny.net/purge" \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"urls\":[\"${BUNNY_PULL_ZONE_URL}/*\"]}" --fail